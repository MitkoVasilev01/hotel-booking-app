<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактиране на Хотел</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        no-spinners::-webkit-outer-spin-button,
        .no-spinners::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .no-spinners[type=number] {
            -moz-appearance: textfield;
        }FF
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Редактиране на хотел</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/hotels/edit/{id}(id=${hotelDto.id})}" th:object="${hotelDto}" method="post">

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Име на хотела</label>
                                <input type="text" th:field="*{name}" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Категория</label>
                                <select th:field="*{category}" class="form-select">
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Град</label>
                                <input type="text" th:field="*{location}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Точен адрес</label>
                                <input type="text" th:field="*{address}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Цена на нощувка (в лева)</label>
                            <div class="input-group">
                                <input type="number" min="0" step="1" th:field="*{pricePerNight}" class="form-control no-spinners" placeholder="100" required>
                                <span class="input-group-text">EUR.</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea th:field="*{description}" class="form-control" rows="4" required></textarea>
                        </div>



                        <div class="mb-3">
                            <label class="form-label">Удобства (разделени със запетая)</label>
                            <input type="text" name="amenitiesText" th:field="*{amenitiesText}" class="form-control" placeholder="напр. WiFi, SPA, Parking">
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg">Запази Промените</button>
                            <a th:href="@{/hotels/details/{id}(id=${hotelDto.id})}" class="btn btn-outline-secondary">Отказ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
